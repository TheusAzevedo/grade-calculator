<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Card</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .pending-badge {
            background-color: #666;
            color: #fff;
        }

        .logout {
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Report Card</h1>
        <p class="subtitle" id="welcomeMessage"></p>

        <div id="resultCard" class="result-card">
            <h2 id="studentName"></h2>
            <p class="result-info">Average: <span id="average">--</span></p>
            <div id="status" class="badge pending-badge">Pending</div>
        </div>

        <p class="subtitle logout"><a href="index.html" onclick="logout()">Logout</a></p>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem('currentUser'));

        if (!user) {
            location.href = 'index.html';
        } else {
            const welcome = document.getElementById('welcomeMessage');
            welcome.textContent = 'Logged in as ' + user.name;
            document.getElementById('studentName').textContent = user.name;

            const history = JSON.parse(localStorage.getItem('gradesHistory')) || [];
            const record = history.find(item => item.name === user.name.toLowerCase());

            if (record) {
                const key = record.status.toLowerCase();
                const status = document.getElementById('status');

                document.getElementById('average').textContent = record.average;
                document.getElementById('resultCard').className = 'result-card ' + key + '-card';
                status.className = 'badge ' + key + '-badge';
                status.textContent = record.status;
            } else {
                welcome.textContent += ' (no grades yet)';
            }
        }

        function logout() {
            localStorage.removeItem('currentUser');
        }
    </script>
</body>
</html>
