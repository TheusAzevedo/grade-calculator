<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .hidden { display: none !important; }

        .link {
            margin-top: 15px;
        }

        #registerBox, #teacherRegisterBox {
            margin-top: 20px;
            max-width: 460px;
        }

        .teacher-link {
            display: block;
            margin-top: 12px;
            font-size: 13px;
            color: #a8a29e;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container" id="loginBox">
        <h1>Login</h1>
        <p class="subtitle">Sign in with your email to continue</p>

        <div class="form-group">
            <label for="loginEmail">Email</label>
            <input type="email" id="loginEmail" placeholder="example@domain.com">
        </div>

        <div class="form-group">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword">
        </div>

        <button onclick="handleLogin()">Sign in</button>
        <p class="subtitle link"><a href="#" onclick="showCard('registerBox')">Create student account</a></p>
        <a href="#" class="teacher-link" onclick="showCard('teacherRegisterBox')">Are you a teacher? Click here</a>
    </div>

    <div class="container hidden" id="registerBox">
        <h1>Student Registration</h1>
        <p class="subtitle">Create your immutable student account</p>

        <div class="form-group">
            <label for="regFirstName">First Name</label>
            <input type="text" id="regFirstName" placeholder="e.g., John">
        </div>

        <div class="form-group">
            <label for="regLastName">Last Name</label>
            <input type="text" id="regLastName" placeholder="e.g., Doe">
        </div>

        <div class="form-group">
            <label for="regEmail">Email</label>
            <input type="email" id="regEmail" placeholder="student@domain.com">
        </div>

        <div class="form-group">
            <label for="regPassword">Password (Min 6 chars)</label>
            <input type="password" id="regPassword">
        </div>

        <div class="form-group">
            <label for="regConfirmPassword">Confirm Password</label>
            <input type="password" id="regConfirmPassword">
        </div>

        <button onclick="handleStudentRegister()">Register as Student</button>
        <p class="subtitle link"><a href="#" onclick="showCard('loginBox')">Back to Sign In</a></p>
    </div>

    <div class="container hidden" id="teacherRegisterBox">
        <h1>Teacher Staff Portal</h1>
        <p class="subtitle">Authorized institutional registration only</p>

        <div class="form-group">
            <label for="tFirstName">First Name</label>
            <input type="text" id="tFirstName" placeholder="e.g., Jane">
        </div>

        <div class="form-group">
            <label for="tLastName">Last Name</label>
            <input type="text" id="tLastName" placeholder="e.g., Smith">
        </div>

        <div class="form-group">
            <label for="tEmail">Institutional Email</label>
            <input type="email" id="tEmail" placeholder="teacher@school.com">
        </div>

        <div class="form-group">
            <label for="tPassword">Password (Min 6 chars)</label>
            <input type="password" id="tPassword">
        </div>

        <div class="form-group">
            <label for="tAccessKey">Institutional Access Key</label>
            <input type="password" id="tAccessKey" placeholder="Enter security token">
        </div>

        <button onclick="handleTeacherRegister()" style="background-color: #e05555;">Verify &amp; Save Staff Account</button>
        <p class="subtitle link"><a href="#" onclick="showCard('loginBox')">Back to Sign In</a></p>
    </div>

    <script>
        if (!localStorage.getItem('usersDB')) {
            var db = {
                "teacher@school.com": { password: btoa("teacher123"), role: "teacher", name: btoa("Prof. Matheus"), studentID: "" },
                "student@school.com": { password: btoa("student123"), role: "student", name: btoa("Matheus Dias"), studentID: "123456" }
            };
            localStorage.setItem('usersDB', JSON.stringify(db));
        }

        var emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        var nameRegex = /^[A-Za-zÀ-ÖØ-öø-ÿ]{2,}$/;

        function showCard(targetId) {
            var cards = ['loginBox', 'registerBox', 'teacherRegisterBox'];
            for (var i = 0; i < cards.length; i++) {
                document.getElementById(cards[i]).classList.add('hidden');
            }
            document.getElementById(targetId).classList.remove('hidden');
        }

        function handleLogin() {
            var email = document.getElementById('loginEmail').value.trim().toLowerCase();
            var password = document.getElementById('loginPassword').value;
            var users = JSON.parse(localStorage.getItem('usersDB'));
            var user = users[email];

            if (!emailRegex.test(email)) {
                alert("Security Error: Please enter a valid email format.");
                return;
            }

            if (!user || atob(user.password) !== password) {
                alert("Wrong email or password.");
                return;
            }

            localStorage.setItem('currentUser', JSON.stringify({
                email: email,
                name: atob(user.name),
                role: user.role,
                studentID: user.studentID
            }));
            location.href = user.role === 'teacher' ? 'teacher.html' : 'student.html';
        }

        function handleStudentRegister() {
            var firstName = document.getElementById('regFirstName').value.trim();
            var lastName = document.getElementById('regLastName').value.trim();
            var email = document.getElementById('regEmail').value.trim().toLowerCase();
            var password = document.getElementById('regPassword').value;
            var confirmPassword = document.getElementById('regConfirmPassword').value;

            if (!firstName || !lastName || !email || !password || !confirmPassword) {
                alert("Validation Error: Fill in all the fields.");
                return;
            }

            if (!nameRegex.test(firstName)) {
                alert("Security Error: First Name must contain only letters and be at least 2 characters long.");
                return;
            }
            if (!nameRegex.test(lastName)) {
                alert("Security Error: Last Name must contain only letters and be at least 2 characters long.");
                return;
            }

            if (!emailRegex.test(email)) {
                alert("Security Error: Invalid email format. Use pattern: user@domain.com");
                return;
            }

            if (password.length < 6) {
                alert("Security Error: Password must be at least 6 characters long.");
                return;
            }

            if (password !== confirmPassword) {
                alert("Validation Error: Passwords do not match.");
                return;
            }

            var users = JSON.parse(localStorage.getItem('usersDB')) || {};

            if (users[email] && users[email].role === 'teacher') {
                alert("Conflict Error: This email is already registered as a Teacher account.");
                return;
            }

            var fullName = firstName.charAt(0).toUpperCase() + firstName.slice(1) + " " + lastName.charAt(0).toUpperCase() + lastName.slice(1);
            var studentId = users[email] ? users[email].studentID : "";

            if (!studentId) {
                var sameName = Object.values(users).find(function (u) {
                    return atob(u.name).toLowerCase() === fullName.toLowerCase();
                });
                if (sameName) {
                    studentId = sameName.studentID;
                }
            }

            if (!studentId) {
                do {
                    studentId = Math.floor(100000 + Math.random() * 900000).toString();
                } while (Object.values(users).some(function (u) { return u.studentID === studentId; }));
            }

            users[email] = {
                password: btoa(password),
                role: "student",
                name: btoa(fullName),
                studentID: studentId
            };

            localStorage.setItem('usersDB', JSON.stringify(users));
            alert("Student account securely processed!\n\nYour PERMANENT Student ID (RA) is: " + studentId);
            showCard('loginBox');
        }

        function handleTeacherRegister() {
            var firstName = document.getElementById('tFirstName').value.trim();
            var lastName = document.getElementById('tLastName').value.trim();
            var email = document.getElementById('tEmail').value.trim().toLowerCase();
            var password = document.getElementById('tPassword').value;
            var accessKey = document.getElementById('tAccessKey').value.trim();

            if (!firstName || !lastName || !email || !password || !accessKey) {
                alert("Validation Error: Fill in all institutional fields.");
                return;
            }

            if (!nameRegex.test(firstName) || !nameRegex.test(lastName)) {
                alert("Security Error: Names must contain only letters and be at least 2 characters long.");
                return;
            }

            if (!emailRegex.test(email)) {
                alert("Security Error: Invalid institutional email format.");
                return;
            }

            if (password.length < 6) {
                alert("Security Error: Password must be at least 6 characters long.");
                return;
            }

            if (btoa(accessKey) !== "U0NIT09MMjAyNg==") {
                alert("Access Denied: Invalid Institutional Access Key.");
                return;
            }

            var users = JSON.parse(localStorage.getItem('usersDB')) || {};

            if (users[email] && users[email].role === 'student') {
                alert("Conflict Error: This email is already registered as a Student account.");
                return;
            }

            var fullName = "Prof. " + firstName.charAt(0).toUpperCase() + firstName.slice(1) + " " + lastName.charAt(0).toUpperCase() + lastName.slice(1);

            users[email] = {
                password: btoa(password),
                role: "teacher",
                name: btoa(fullName),
                studentID: ""
            };

            localStorage.setItem('usersDB', JSON.stringify(users));
            alert("Teacher Staff account authorized and created successfully!");
            showCard('loginBox');
        }
    </script>
</body>
</html>
