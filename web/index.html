<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .hidden { display: none !important; }

        select {
            width: 100%;
            padding: 9px;
            background-color: #313743;
            border: 1px solid #454c59;
            border-radius: 5px;
            color: #fff;
        }

        .link {
            margin-top: 15px;
        }

        #registerBox {
            margin-top: 20px;
            max-width: 460px;
        }
    </style>
</head>
<body>
    <div class="container" id="loginBox">
        <h1>Login</h1>
        <p class="subtitle">Sign in with your email to continue</p>

        <div class="form-group">
            <label for="loginEmail">Email</label>
            <input type="email" id="loginEmail" placeholder="example@domain.com">
        </div>

        <div class="form-group">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword">
        </div>

        <button onclick="handleLogin()">Sign in</button>
        <p class="subtitle link"><a href="#" onclick="toggleCards()">Create account / change password</a></p>
    </div>

    <div class="container hidden" id="registerBox">
        <h1>Account</h1>
        <p class="subtitle">Create a user or change a password</p>

        <div class="form-group">
            <label for="regFirstName">First Name</label>
            <input type="text" id="regFirstName">
        </div>

        <div class="form-group">
            <label for="regLastName">Last Name</label>
            <input type="text" id="regLastName">
        </div>

        <div class="form-group">
            <label for="regEmail">Email</label>
            <input type="email" id="regEmail" placeholder="example@domain.com">
        </div>

        <div class="form-group">
            <label for="regPassword">Password</label>
            <input type="password" id="regPassword">
        </div>

        <div class="form-group">
            <label for="regConfirmPassword">Confirm Password</label>
            <input type="password" id="regConfirmPassword">
        </div>

        <div class="form-group">
            <label for="regRole">Role</label>
            <select id="regRole">
                <option value="student">Student</option>
                <option value="teacher">Teacher</option>
            </select>
        </div>

        <button onclick="handleRegister()">Save</button>
        <p class="subtitle link"><a href="#" onclick="toggleCards()">Back</a></p>
    </div>

    <script>
        if (!localStorage.getItem('usersDB')) {
            localStorage.setItem('usersDB', JSON.stringify({
                "teacher@school.com": { password: "teacher123", role: "teacher", name: "Prof. Matheus", studentID: "" },
                "student@school.com": { password: "student123", role: "student", name: "Matheus Dias", studentID: "123456" }
            }));
        }

        function toggleCards() {
            document.getElementById('loginBox').classList.toggle('hidden');
            document.getElementById('registerBox').classList.toggle('hidden');
        }

        function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim().toLowerCase();
            const password = document.getElementById('loginPassword').value;
            const users = JSON.parse(localStorage.getItem('usersDB'));
            const user = users[email];

            if (!user || user.password !== password) {
                alert("Wrong email or password.");
                return;
            }

            localStorage.setItem('currentUser', JSON.stringify({
                email: email,
                name: user.name,
                role: user.role,
                studentID: user.studentID
            }));

            location.href = user.role === 'teacher' ? 'teacher.html' : 'student.html';
        }

        function handleRegister() {
            const firstName = document.getElementById('regFirstName').value.trim();
            const lastName = document.getElementById('regLastName').value.trim();
            const email = document.getElementById('regEmail').value.trim().toLowerCase();
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            const role = document.getElementById('regRole').value;

            if (!firstName || !lastName || !email || !password || !confirmPassword) {
                alert("Fill in all the fields.");
                return;
            }

            if (password !== confirmPassword) {
                alert("Passwords do not match. Please verify.");
                return;
            }

            const users = JSON.parse(localStorage.getItem('usersDB')) || {};
            const fullName = `${firstName.charAt(0).toUpperCase() + firstName.slice(1)} ${lastName.charAt(0).toUpperCase() + lastName.slice(1)}`;

            let existingStudentID = "";

            if (users[email]) {
                existingStudentID = users[email].studentID;
            } else {
                const duplicateNameUser = Object.values(users).find(u => u.name.toLowerCase() === fullName.toLowerCase());
                if (duplicateNameUser) {
                    existingStudentID = duplicateNameUser.studentID;
                }
            }

            if (role === 'student' && !existingStudentID) {
                do {
                    existingStudentID = Math.floor(100000 + Math.random() * 900000).toString();
                    var idExists = Object.values(users).some(u => u.studentID === existingStudentID);
                } while (idExists);
            }

            users[email] = {
                password: password,
                role: role,
                name: fullName,
                studentID: role === 'student' ? existingStudentID : ""
            };

            localStorage.setItem('usersDB', JSON.stringify(users));

            if (role === 'student') {
                alert(`Account securely processed!\n\nYour PERMANENT Student ID (RA) is: ${existingStudentID}\nThis code is locked to your Name and Email.`);
            } else {
                alert("Saved.");
            }

            toggleCards();
        }
    </script>
</body>
</html>
