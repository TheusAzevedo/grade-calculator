<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .hidden { display: none !important; }

        .link {
            margin-top: 15px;
        }

        #registerBox, #teacherRegisterBox {
            margin-top: 20px;
            max-width: 460px;
        }
        
        .teacher-link {
            display: block;
            margin-top: 12px;
            font-size: 13px;
            color: #a8a29e;
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- 1️⃣ CARD DE SIGN IN (LOGIN VIA EMAIL) -->
    <div class="container" id="loginBox">
        <h1>Login</h1>
        <p class="subtitle">Sign in with your email to continue</p>

        <div class="form-group">
            <label for="loginEmail">Email</label>
            <input type="email" id="loginEmail" placeholder="example@domain.com">
        </div>

        <div class="form-group">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword">
        </div>

        <button onclick="handleLogin()">Sign in</button>
        <p class="subtitle link"><a href="#" onclick="showCard('registerBox')">Create student account</a></p>
        <a href="#" class="teacher-link" onclick="showCard('teacherRegisterBox')">Are you a teacher? Click here</a>
    </div>

    <!-- 2️⃣ CARD DE REGISTRO EXCLUSIVO DE ESTUDANTES -->
    <div class="container hidden" id="registerBox">
        <h1>Student Registration</h1>
        <p class="subtitle">Create your immutable student account</p>

        <div class="form-group">
            <label for="regFirstName">First Name</label>
            <input type="text" id="regFirstName">
        </div>

        <div class="form-group">
            <label for="regLastName">Last Name</label>
            <input type="text" id="regLastName">
        </div>

        <div class="form-group">
            <label for="regEmail">Email</label>
            <input type="email" id="regEmail" placeholder="student@domain.com">
        </div>

        <div class="form-group">
            <label for="regPassword">Password</label>
            <input type="password" id="regPassword">
        </div>

        <div class="form-group">
            <label for="regConfirmPassword">Confirm Password</label>
            <input type="password" id="regConfirmPassword">
        </div>

        <button onclick="handleStudentRegister()">Register as Student</button>
        <p class="subtitle link"><a href="#" onclick="showCard('loginBox')">Back to Sign In</a></p>
    </div>

    <!-- 3️⃣ CARD DE REGISTRO EXCLUSIVO DE PROFESSORES (COM CHAVE DE ACESSO) -->
    <div class="container hidden" id="teacherRegisterBox">
        <h1>Teacher Staff Portal</h1>
        <p class="subtitle">Authorized institutional registration only</p>

        <div class="form-group">
            <label for="tFirstName">First Name</label>
            <input type="text" id="tFirstName">
        </div>

        <div class="form-group">
            <label for="tLastName">Last Name</label>
            <input type="text" id="tLastName">
        </div>

        <div class="form-group">
            <label for="tEmail">Institutional Email</label>
            <input type="email" id="tEmail" placeholder="teacher@school.com">
        </div>

        <div class="form-group">
            <label for="tPassword">Password</label>
            <input type="password" id="tPassword">
        </div>

        <div class="form-group">
            <label for="tAccessKey">Institutional Access Key</label>
            <input type="password" id="tAccessKey" placeholder="Enter security token">
        </div>

        <button onclick="handleTeacherRegister()" style="background-color: #e05555;">Verify & Save Staff Account</button>
        <p class="subtitle link"><a href="#" onclick="showCard('loginBox')">Back to Sign In</a></p>
    </div>

    <script>
        // Inicializa a base mock se estiver limpa
        if (!localStorage.getItem('usersDB')) {
            localStorage.setItem('usersDB', JSON.stringify({
                "teacher@school.com": { password: "teacher123", role: "teacher", name: "Prof. Matheus", studentID: "" },
                "student@school.com": { password: "student123", role: "student", name: "Matheus Dias", studentID: "123456" }
            }));
        }

        // Gerenciador inteligente de transição de telas
        function showCard(targetId) {
            ['loginBox', 'registerBox', 'teacherRegisterBox'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(targetId).classList.remove('hidden');
        }

        function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim().toLowerCase();
            const password = document.getElementById('loginPassword').value;
            const users = JSON.parse(localStorage.getItem('usersDB'));
            const user = users[email];

            if (!user || user.password !== password) {
                alert("Wrong email or password.");
                return;
            }

            localStorage.setItem('currentUser', JSON.stringify({ 
                email: email, 
                name: user.name, 
                role: user.role,
                studentID: user.studentID 
            }));
            location.href = user.role === 'teacher' ? 'teacher.html' : 'student.html';
        }

        // CADASTRO EXCLUSIVO DE ALUNOS
        function handleStudentRegister() {
            const firstName = document.getElementById('regFirstName').value.trim();
            const lastName = document.getElementById('regLastName').value.trim();
            const email = document.getElementById('regEmail').value.trim().toLowerCase();
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;

            if (!firstName || !lastName || !email || !password || !confirmPassword) {
                alert("Fill in all the fields.");
                return;
            }

            if (password !== confirmPassword) {
                alert("Passwords do not match.");
                return;
            }

            const users = JSON.parse(localStorage.getItem('usersDB')) || {};
            
            if (users[email] && users[email].role === 'teacher') {
                alert("This email is already registered as a Teacher account.");
                return;
            }

            const fullName = `${firstName.charAt(0).toUpperCase() + firstName.slice(1)} ${lastName.charAt(0).toUpperCase() + lastName.slice(1)}`;
            let existingStudentID = users[email] ? users[email].studentID : "";

            if (!existingStudentID) {
                const duplicateNameUser = Object.values(users).find(u => u.name.toLowerCase() === fullName.toLowerCase());
                if (duplicateNameUser) {
                    existingStudentID = duplicateNameUser.studentID;
                }
            }

            if (!existingStudentID) {
                do {
                    existingStudentID = Math.floor(100000 + Math.random() * 900000).toString();
                    var idExists = Object.values(users).some(u => u.studentID === existingStudentID);
                } while (idExists);
            }

            users[email] = {
                password: password,
                role: "student",
                name: fullName,
                studentID: existingStudentID
            };

            localStorage.setItem('usersDB', JSON.stringify(users));
            alert(`Student account securely processed!\n\nYour PERMANENT Student ID (RA) is: ${existingStudentID}`);
            showCard('loginBox');
        }

        // CADASTRO EXCLUSIVO DE PROFESSORES (COM VALIDAÇÃO DE CHAVE)
        function handleTeacherRegister() {
            const firstName = document.getElementById('tFirstName').value.trim();
            const lastName = document.getElementById('tLastName').value.trim();
            const email = document.getElementById('tEmail').value.trim().toLowerCase();
            const password = document.getElementById('tPassword').value;
            const accessKey = document.getElementById('tAccessKey').value.trim();

            if (!firstName || !lastName || !email || !password || !accessKey) {
                alert("Fill in all institutional fields.");
                return;
            }

            if (accessKey !== "SCHOOL2026") {
                alert("Access Denied: Invalid Institutional Access Key.");
                return;
            }

            const users = JSON.parse(localStorage.getItem('usersDB')) || {};

            if (users[email] && users[email].role === 'student') {
                alert("This email is already registered as a Student account.");
                return;
            }

            const fullName = `Prof. ${firstName.charAt(0).toUpperCase() + firstName.slice(1)} ${lastName.charAt(0).toUpperCase() + lastName.slice(1)}`;

            users[email] = {
                password: password,
                role: "teacher",
                name: fullName,
                studentID: ""
            };

            localStorage.setItem('usersDB', JSON.stringify(users));
            alert("Teacher Staff account authorized and created successfully!");
            showCard('loginBox');
        }
    </script>
</body>
</html>
