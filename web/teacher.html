<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher</title>
    <link rel="stylesheet" href="style.css">
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: #313743;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #454c59;
        }

        th {
            background-color: #3a7bd5;
            color: #fff;
        }

        tr:hover {
            background-color: #3b4250;
        }

        .empty {
            text-align: center;
            color: #9aa0aa;
        }

        .danger {
            background-color: #c43d3d;
            margin-top: 20px;
        }

        .danger:hover {
            background-color: #a83232;
        }

        .logout {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container" style="max-width: 550px;">
        <h1>Teacher</h1>
        <p class="subtitle">Enter the grades for a student.</p>

        <div class="form-group">
            <label for="studentID">Student ID</label>
            <input type="text" id="studentID">
        </div>
        <div class="form-group">
            <label for="grade1">Grade 1</label>
            <input type="number" id="grade1" min="0" max="10" step="0.1">
        </div>
        <div class="form-group">
            <label for="grade2">Grade 2</label>
            <input type="number" id="grade2" min="0" max="10" step="0.1">
        </div>
        <div class="form-group">
            <label for="grade3">Grade 3</label>
            <input type="number" id="grade3" min="0" max="10" step="0.1">
        </div>
        <button onclick="saveStudentGrade()">Save</button>

        <table>
            <thead>
                <tr>
                    <th>Student</th>
                    <th>Average</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="historyTableBody"></tbody>
        </table>

        <button class="danger" onclick="clearHistory()">Clear records</button>
        <p class="subtitle logout"><a href="index.html">Logout</a></p>
    </div>

    <script>
        function renderTable() {
            const history = JSON.parse(localStorage.getItem('gradesHistory')) || [];
            const tbody = document.getElementById('historyTableBody');
            tbody.innerHTML = '';

            if (history.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="empty">No records.</td></tr>';
                return;
            }

            history.forEach(item => {
                const row = document.createElement('tr');
                const student = item.id + ' - ' + item.studentName;

                [student, item.average, item.status].forEach(text => {
                    const cell = document.createElement('td');
                    cell.textContent = text;
                    row.appendChild(cell);
                });
                tbody.appendChild(row);
            });
        }

        function saveStudentGrade() {
            const studentID = document.getElementById('studentID').value.trim();
            const grades = ['grade1', 'grade2', 'grade3']
                .map(id => parseFloat(document.getElementById(id).value));

            if (!studentID || grades.some(isNaN)) {
                alert("Fill in all the fields.");
                return;
            }

            if (grades.some(g => g < 0 || g > 10)) {
                alert("Grades must be between 0 and 10.");
                return;
            }

            const users = JSON.parse(localStorage.getItem('usersDB')) || {};
            const username = Object.keys(users).find(key => users[key].studentID === studentID);

            if (!username) {
                alert("Student ID not found.");
                return;
            }

            const avg = grades.reduce((a, b) => a + b) / 3;
            let status = "Failed";
            if (avg >= 7) status = "Approved";
            else if (avg >= 5) status = "Remedial";

            const history = (JSON.parse(localStorage.getItem('gradesHistory')) || [])
                .filter(item => item.id !== studentID);

            history.push({
                id: studentID,
                name: username,
                studentName: users[username].name,
                average: avg.toFixed(2),
                status: status
            });

            localStorage.setItem('gradesHistory', JSON.stringify(history));

            renderTable();
            ['studentID', 'grade1', 'grade2', 'grade3'].forEach(id => {
                document.getElementById(id).value = '';
            });
        }

        function clearHistory() {
            if (confirm("Clear all records?")) {
                localStorage.removeItem('gradesHistory');
                renderTable();
            }
        }

        renderTable();
    </script>
</body>
</html>
