<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Grade Calculator</h1>
        <p class="subtitle">Fill in the grades to see if the student passed.</p>

        <div class="form-group">
            <label for="studentName">Name</label>
            <input type="text" id="studentName">
        </div>

        <div class="form-group">
            <label for="grade1">Grade 1</label>
            <input type="number" id="grade1" step="0.1" min="0" max="10">
        </div>

        <div class="form-group">
            <label for="grade2">Grade 2</label>
            <input type="number" id="grade2" step="0.1" min="0" max="10">
        </div>

        <div class="form-group">
            <label for="grade3">Grade 3</label>
            <input type="number" id="grade3" step="0.1" min="0" max="10">
        </div>

        <button onclick="calculateAverage()">Calculate</button>

        <div id="resultCard" class="result-card hidden">
            <h2 id="resultName"></h2>
            <p class="result-info">Average: <span id="resultAverage"></span></p>
            <div id="statusBadge" class="badge"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
